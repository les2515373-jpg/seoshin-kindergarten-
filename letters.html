<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://seoshin-kindergarten.vercel.app/letters.html">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#A8E6CF">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="국공립 서신어린이집">
  <meta property="og:title" content="지난 가정통신문 | 국공립 서신어린이집">
  <meta property="og:description" content="서신어린이집 주간 가정통신문을 월별로 모았습니다.">
  <meta property="og:url" content="https://seoshin-kindergarten.vercel.app/letters.html">
  <meta property="og:image" content="https://seoshin-kindergarten.vercel.app/images/og-cover.jpg">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint:#A8E6CF; --mint-light:#D4F5E9; --mint-dark:#5DBF9A;
      --peach:#FFD3B6; --peach-light:#FFF0E8; --peach-dark:#E8856A;
      --text-dark:#3D2C2C; --text-mid:#7A6A6A; --text-light:#B0A0A0;
      --bg-main:#FAFAFA; --white:#FFFFFF;
      --shadow:0 4px 16px rgba(61,44,44,0.08);
      --shadow-sm:0 2px 8px rgba(61,44,44,0.06);
      --border:1.5px solid rgba(61,44,44,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Noto Sans KR', sans-serif;
      color:var(--text-dark);
      background:var(--bg-main);
      word-break:keep-all;
      overflow-wrap:break-word;
    }

    .lt-nav {
      position:sticky; top:0; z-index:100;
      background:rgba(255,255,255,0.94);
      backdrop-filter:blur(12px);
      border-bottom:var(--border);
    }
    .lt-nav-inner {
      max-width:1100px; margin:0 auto;
      height:62px; padding:0 24px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .lt-logo {
      font-size:16px; font-weight:800; color:var(--mint-dark);
      text-decoration:none; white-space:nowrap;
    }
    .lt-back {
      font-size:13.5px; font-weight:700; color:var(--text-mid);
      text-decoration:none; white-space:nowrap;
      padding:9px 18px; border-radius:50px; background:var(--bg-main); border:var(--border);
      transition:background .2s, color .2s;
    }
    .lt-back:hover { background:var(--mint-light); color:var(--mint-dark); }

    .lt-head {
      text-align:center;
      padding:64px 24px 34px;
      background:linear-gradient(145deg, var(--mint-light), var(--peach-light));
    }
    .lt-badge {
      display:inline-block; background:var(--white);
      border-radius:100px; padding:8px 22px;
      font-size:13px; font-weight:700; color:var(--mint-dark);
      margin-bottom:18px; box-shadow:var(--shadow-sm);
    }
    .lt-head h1 {
      font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
      font-size:34px; font-weight:700; line-height:1.4; margin-bottom:14px;
    }
    .lt-head p { font-size:15px; color:var(--text-mid); line-height:1.8; }

    .lt-monthnav {
      position:sticky; top:62px; z-index:90;
      background:rgba(250,250,250,0.95);
      backdrop-filter:blur(10px);
      border-bottom:var(--border);
      padding:14px 24px;
    }
    .lt-monthnav-inner {
      max-width:1100px; margin:0 auto;
      display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .lt-chips { display:flex; gap:7px; flex-wrap:wrap; }
    .lt-chips button {
      font-family:inherit; cursor:pointer;
      font-size:13px; font-weight:700;
      color:var(--text-mid); background:var(--white);
      border:var(--border); border-radius:50px;
      padding:8px 16px; transition:all .2s;
    }
    .lt-chips button:hover { background:var(--mint-light); color:var(--mint-dark); }
    .lt-chips button.on { background:var(--mint); color:var(--text-dark); border-color:transparent; }
    .lt-search { position:relative; flex:0 1 300px; }
    .lt-search input {
      width:100%; font-family:inherit; font-size:14px;
      padding:10px 16px 10px 38px; border-radius:50px;
      border:1.5px solid rgba(61,44,44,0.14); background:var(--white); color:var(--text-dark);
    }
    .lt-search input:focus { outline:none; border-color:var(--mint-dark); box-shadow:0 0 0 3px var(--mint-light); }
    .lt-search::before { content:'🔍'; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:13px; }
    .lt-quick { max-width:1100px; margin:10px auto 0; font-size:12.5px; color:var(--text-light); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .lt-quick button {
      font-family:inherit; cursor:pointer; font-size:12px; font-weight:600;
      background:none; border:0; color:var(--mint-dark); padding:2px 4px; text-decoration:underline; text-underline-offset:3px;
    }
    .lt-empty { text-align:center; padding:60px 20px; color:var(--text-mid); font-size:15px; line-height:1.8; }

    .lt-wrap { max-width:1100px; margin:0 auto; padding:44px 24px 72px; }
    .lt-month { margin-bottom:52px; }
    .lt-month h2 {
      font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
      font-size:25px; font-weight:700; color:var(--mint-dark);
      padding-bottom:14px; margin-bottom:24px;
      border-bottom:2px solid var(--mint-light);
    }
    .lt-month h2 small { font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; color:var(--text-light); margin-left:10px; }

    .lt-note {
      max-width:760px; margin:0 auto;
      text-align:center; font-size:13px; color:var(--text-light);
      line-height:1.9; padding:28px 24px 0; border-top:var(--border);
    }
    .lt-foot { text-align:center; padding:40px 24px 60px; }
    .lt-foot a {
      display:inline-block; text-decoration:none;
      background:var(--mint); color:var(--text-dark);
      font-size:14.5px; font-weight:700;
      padding:14px 32px; border-radius:50px;
      transition:transform .2s, box-shadow .2s;
    }
    .lt-foot a:hover { transform:translateY(-2px); box-shadow:var(--shadow); }

    @media (max-width:768px) {
      .lt-head { padding:40px 20px 24px; }
      .lt-head h1 { font-size:25px; }
      .lt-head p { font-size:14px; }
      .lt-monthnav { padding:10px 16px; }
      .lt-monthnav-inner { gap:10px; }
      .lt-search { flex:1 1 100%; order:-1; }
      .lt-chips { flex-wrap:nowrap; overflow-x:auto; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none; width:calc(100% + 32px); }
      .lt-chips::-webkit-scrollbar { display:none; }
      .lt-chips button { flex:none; font-size:12.5px; padding:7px 14px; }
      .lt-quick { display:none; }
      .lt-wrap { padding:28px 16px 56px; }
      .lt-month h2 { font-size:21px; }
    }
  </style>
  <link rel="stylesheet" href="letters.css">
</head>
<body>

<nav class="lt-nav">
  <div class="lt-nav-inner">
    <a href="/" class="lt-logo">🌱 국공립 서신어린이집</a>
    <a href="/#notice" class="lt-back">← 홈페이지로 돌아가기</a>
  </div>
</nav>

<header class="lt-head">
  <div class="lt-badge">서신 소식</div>
  <h1>지난 가정통신문</h1>
  <p>매주 발행하는 가정통신문 <strong id="lt-count"></strong>호를 모두 모았습니다.<br>월별로 보거나 부모교육 주제로 찾아보세요. 표지를 누르면 크게 넘겨 볼 수 있어요.</p>
</header>

<div class="lt-monthnav">
  <div class="lt-monthnav-inner">
    <div class="lt-chips" id="lt-chips" aria-label="월별 보기"></div>
    <label class="lt-search"><input type="search" id="lt-q" placeholder="주제로 찾기 (예: 채소, 식중독)" aria-label="가정통신문 주제 검색"></label>
  </div>
  <div class="lt-quick">자주 찾는 주제:
    <button type="button" data-q="채소 토마토 애호박 파프리카 고구마순 아욱 달걀 보양식 당류 배달음식">음식·영양</button>
    <button type="button" data-q="예방 건강 미세먼지 식중독">건강·위생</button>
    <button type="button" data-q="수줍음 감정 들을까 호기심 스마트폰 부모의 용기">아이 마음·대화법</button>
    <button type="button" data-q="전주 행사 숲놀이터">가볼 만한 곳·행사</button>
  </div>
</div>

<main class="lt-wrap">
  <div id="lt-list"></div>
  <p class="lt-empty" id="lt-empty" hidden>찾으시는 가정통신문이 없어요.<br>다른 낱말로 검색해 보시거나 '전체'를 눌러 주세요.</p>
  <noscript><p class="lt-empty">가정통신문 목록을 보려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>

  <p class="lt-note">
    ※ 아이들의 개인정보 보호를 위해 <strong>이름과 얼굴은 가려서</strong> 게시하고 있습니다.<br>
    원본은 어린이집에서 가정으로 배부해 드린 가정통신문을 확인해 주세요.
  </p>
</main>

<div class="lt-foot">
  <a href="/#notice">← 홈페이지로 돌아가기</a>
</div>

<script src="letters-data.js"></script>
<script src="letters.js"></script>
<script>
  renderLetterArchive({
    list: document.getElementById('lt-list'),
    nav: document.getElementById('lt-chips'),
    search: document.getElementById('lt-q'),
    empty: document.getElementById('lt-empty'),
    count: document.getElementById('lt-count')
  });
</script>
</body>
</html>
