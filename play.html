<script>
const THEMES={
 spring:["봄","꽃, 딸기, 텃밭, 숲놀이터"], summer:["여름","바다, 물놀이, 수박, 캠핑"],
 autumn:["가을","자연물, 감, 도토리, 김장"], winter:["겨울","눈, 얼음, 스케이트, 크리스마스"],
 bugs:["곤충·동물·공룡","꿀벌, 거미, 개미, 애벌레, 반려동물, 농장"], science:["과학·원리 탐구","경사와 굴림, 빛, 바람, 자석, 실험"],
 space:["우주","우주선, 외계인, 로켓"], cars:["자동차·교통·공사장","정비소, 세차장, 도로, 교통안전"],
 build:["쌓기·건축","레고, 집짓기, 도미노"], roles:["역할놀이·직업","가게, 소방관, 의사, 미용실, 택배"],
 me:["나·마음·가족","감정, 우리 집, 어버이날"], habits:["생활습관·건강·안전","배변, 양치, 손씻기, 스스로 하기"],

 nature:["숲·바깥놀이","숲놀이터, 산책, 텃밭"], food:["요리·먹거리","쿠킹, 수확, 식품 견학"],
 events:["행사·특별한 날","어린이날, 졸업식, 견학, 공연"]
};
// 화면에는 큰 묶음 9개로 보여 주고, 묶음을 고르면 안에서 세부 주제별로 나눠 보여 준다.
const GROUPS={
 season:["계절·자연","봄·여름·가을·겨울, 숲과 바깥놀이, 곤충과 동물",["spring","summer","autumn","winter","nature","bugs"]],
 explore:["과학·미래","원리 탐구, 실험, 우주, 드론과 코딩",["science","space","future"]],
 eco:["새활용·환경","되살림 놀이터, 재활용 놀잇감, 지구",["eco"]],
 arts:["미술·음악","그리기, 만들기, 색, 악기와 소리",["arts"]],
 body:["몸·감각·손끝","신체 놀이, 감각 탐색, 소근육 놀이",["body","senses","hands"]],
 play:["역할·상상놀이","가게와 직업, 그림책과 상상, 자동차, 쌓기",["roles","story","cars","build"]],
 life:["나·친구·생활","마음과 가족, 친구와 협동, 생활습관",["me","friends","habits"]],
 lang:["말·글·수","한글, 숫자와 모양, 두뇌게임, 바둑, 영어",["lang"]],
 trad:["전통·행사","명절과 옛놀이, 행사와 견학, 요리",["tradition","events","food"]]
};
const MGROUPS={
 paper:["종이·테이프·실","종이, 상자, 휴지심, 테이프, 시트지, 실과 끈",["paper","tape","thread"]],
 art:["물감·점토","물감과 그리기 도구, 점토, 흙, 반죽",["paint","clay"]],
 sense:["물·감각재료","물, 수정토, 슬라임, 얼음, 모래",["sensory"]],
 nature:["자연물·먹거리","나뭇잎, 열매, 꽃, 과일, 요리 재료",["nature","food"]],
 recycle:["재활용품","계란판, 병뚜껑, 페트병, 비닐",["recycle"]],
 toy:["공·블록·자석","볼풀공, 구슬, 풍선, 블록, 자석",["ball","blocks","magnet"]],
 tech:["빛·소리·디지털","손전등과 거울, 악기, 태블릿과 드론",["light","sound","digital"]]
};
const mgroupsOf=i=>Object.keys(MGROUPS).filter(g=>MGROUPS[g][2].some(t=>i.m.includes(t)));
const groupsOf=i=>Object.keys(GROUPS).filter(g=>GROUPS[g][2].some(t=>i.th.includes(t)));
const MATS={
 paper:["종이·상자","습자지, 신문지, 한지, 휴지심, 골판지, 종이컵"], tape:["테이프·시트지","마스킹테이프, 시트지"],
 thread:["실·끈·고무줄","털실, 양말목, 비즈, 모루"], clay:["점토·흙·반죽","유토, 클레이, 밀가루 반죽, 찰흙"],
 sensory:["물·감각재료","물, 수정토, 슬라임, 얼음, 모래"], paint:["물감·그리기","물감, 파스넷, 도장, 판화"],
 light:["빛·거울·셀로판","손전등, LED판, 루페, OHP, 거울지"], recycle:["재활용품·비닐","계란판, 병뚜껑, 페트병, 비닐"],
 blocks:["블록·구성물","레고, 큰십자블록, 백업, 지관"], magnet:["자석","자석블록, 자석 놀잇감"],
 nature:["자연물·식물·과일","나뭇잎, 솔방울, 도토리, 꽃, 과일"], ball:["공·구슬·풍선","볼풀공, 탁구공, 구슬, 풍선, 폼폼이"],
 digital:["디지털 기기","태블릿, 드론, 코딩로봇, 3D펜"], sound:["악기·소리","악기, 생활용품 악기"], food:["요리·식재료","과자, 파스타, 쿠킹 재료"]
};
const KIND={P:"놀이",L:"가정통신문",N:"서신 소식"};
const DATA=(window.SEOSHIN_ARCHIVE||{posts:""});
const items=DATA.posts.trim().split("\n").filter(Boolean).map(l=>{const [d,c,k,t,th,m,cv]=l.split("|");return{d,c,k,t,cv:cv==="c",y:"20"+d.slice(0,2),mo:d.slice(2,4),th:th?th.split(",").filter(x=>THEMES[x]):[],m:m?m.split(",").filter(x=>MATS[x]):[]}}).sort((a,b)=>b.d.localeCompare(a.d));
const fmt=d=>`20${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4,6)}`;
const $=id=>document.getElementById(id);
const st={kind:"P",view:"theme",pick:null,year:"",month:"",q:"",open:{}};
try{const s=JSON.parse(localStorage.getItem("seoshinArchive")||"{}");if(s.kind in KIND)st.kind=s.kind;if(["theme","mat","time"].includes(s.view))st.view=s.view}catch(e){}
const save=()=>{try{localStorage.setItem("seoshinArchive",JSON.stringify({kind:st.kind,view:st.view}))}catch(e){}};
const h=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const years=[...new Set(items.map(i=>i.y))].sort().reverse();
$("year").innerHTML=`<option value="">전체 연도</option>`+years.map(y=>`<option value="${y}">${y}년</option>`).join("");
$("month").innerHTML=`<option value="">전체 월</option>`+Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,"0")}">${i+1}월</option>`).join("");
const first=items[items.length-1], last=items[0];
if(items.length){
  $("stats").innerHTML=`<span>게시물 <b>${items.length.toLocaleString()}</b>개</span><span>놀이 <b>${items.filter(i=>i.k==="P").length.toLocaleString()}</b>개</span><span>기록 기간 <b>${fmt(first.d)} ~ ${fmt(last.d)}</b></span>`;
  $("foot").textContent=`마지막 업데이트 ${DATA.updated||""} · 분류는 게시물 글을 바탕으로 정리했어요. 사진과 자세한 이야기는 각 인스타그램 게시물에서 볼 수 있습니다.`;
}
for(const k in KIND) $("cnt-"+k).textContent=items.filter(i=>i.k===k).length.toLocaleString();

function inPeriod(i){return (!st.year||i.y===st.year)&&(!st.month||i.mo===st.month)}
function inQuery(i){if(!st.q)return true;const s=(i.t+" "+i.th.map(k=>THEMES[k][0]).join(" ")+" "+i.m.map(k=>MATS[k][0]+" "+MATS[k][1]).join(" ")).toLowerCase();return st.q.split(/\s+/).every(w=>s.includes(w))}
// 표지가 없는 게시물(아이 얼굴이 나온 표지 등)은 묶음 그림으로 대신한다.
const ICON={season:"🌸",explore:"🔬",eco:"♻️",arts:"🎨",body:"🤸",play:"🎭",life:"🤝",lang:"🔤",trad:"🏮"};
function mainGroup(i){const gs=groupsOf(i);return st.view==="theme"&&st.pick&&gs.includes(st.pick)?st.pick:gs[0]}
function phIcon(i){if(i.k==="L")return"📮";if(i.k==="N")return"📢";const g=mainGroup(i);return g?ICON[g]:"🧸"}
function phLabel(i){if(i.k==="L")return"가정통신문";if(i.k==="N")return"서신 소식";const g=mainGroup(i);return g?GROUPS[g][0]:"서신 놀이"}
function card(i){
  const tags=st.kind!=="P"?[]:st.view==="mat"?mgroupsOf(i).map(g=>MGROUPS[g][0]):groupsOf(i).map(g=>GROUPS[g][0]);
  const cover=i.cv?`<img class="cv" src="images/play/${i.c}.jpg" alt="" loading="lazy" decoding="async" width="320" height="320">`:`<span class="cv ph ph-${i.k}" aria-hidden="true"><b>${phIcon(i)}</b><span>${phLabel(i)}</span></span>`;
  return `<li class="it"><a href="https://www.instagram.com/p/${i.c}/" target="_blank" rel="noopener noreferrer">${cover}<span class="t">${h(i.t)}</span><time>${fmt(i.d)}</time>${tags.length?`<span class="tags">${tags.map(x=>`<i>${x}</i>`).join("")}</span>`:""}</a></li>`;
}
function groupHTML(key,title,desc,list,limit){
  const open=st.open[key], shown=open?list:list.slice(0,limit);
  return `<section class="group">${title?`<div class="gh"><h2>${title}</h2><span class="n">${list.length}</span></div>`:""}${desc?`<p class="gd">${desc}</p>`:""}<ul class="items">${shown.map(card).join("")}</ul>${shown.length<list.length?`<button type="button" class="more" data-open="${key}">${list.length-shown.length}개 더 보기</button>`:""}</section>`;
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.kind===st.kind));
  ["theme","mat","time"].forEach(v=>$("v-"+v).setAttribute("aria-pressed",st.view===v));
  const isPlay=st.kind==="P", view=isPlay?st.view:"time";
  $("viewRow").hidden=!isPlay;
  const pool=items.filter(i=>i.k===st.kind&&inPeriod(i)&&inQuery(i));
  let html="";
  if(view==="time"){
    $("chips").hidden=true;
    const by={};pool.forEach(i=>{const g=st.year?`${i.y}년 ${+i.mo}월`:`${i.y}년`;(by[g]=by[g]||[]).push(i)});
    html=Object.keys(by).map(g=>groupHTML(g,g,"",by[g],st.year?60:12)).join("");
  }else{
    const GR=view==="theme"?GROUPS:MGROUPS, SUB=view==="theme"?THEMES:MATS, f=view==="theme"?"th":"m";
    const inG=(i,g)=>GR[g][2].some(t=>i[f].includes(t));
    const cnt=g=>pool.filter(i=>inG(i,g)).length;
    const keys=Object.keys(GR).filter(g=>cnt(g)>0);
    if(st.pick&&!keys.includes(st.pick))st.pick=null;
    $("chips").hidden=false;
    $("chips").innerHTML=`<button type="button" class="chip" data-k="" aria-pressed="${!st.pick}">전체<span>${pool.length}</span></button>`+keys.map(g=>`<button type="button" class="chip" data-k="${g}" aria-pressed="${st.pick===g}">${GR[g][0]}<span>${cnt(g)}</span></button>`).join("");
    if(!st.pick){
      html=keys.map(g=>groupHTML(f+g,GR[g][0],GR[g][1],pool.filter(i=>inG(i,g)),8)).join("");
    }else{
      const subs=GR[st.pick][2];
      html=`<section class="group"><div class="gh"><h2>${GR[st.pick][0]}</h2><span class="n">${cnt(st.pick)}</span></div><p class="gd">${GR[st.pick][1]}</p></section>`+
        (subs.length===1?groupHTML("s"+subs[0],"","",pool.filter(i=>i[f].includes(subs[0])),24):
        subs.map(t=>({t,list:pool.filter(i=>i[f].includes(t))})).filter(x=>x.list.length).map(x=>groupHTML("s"+f+x.t,SUB[x.t][0],"",x.list,8)).join(""));
    }
  }
  if(st.kind==="L") html=`<div class="note">2026년 3월부터의 가정통신문은 홈페이지 <a href="letters.html">지난 가정통신문 보관함</a>에서 바로 읽을 수 있어요. 아래 목록은 인스타그램에 올린 가정통신문과 연령별 놀이예상안입니다.</div>`+html;
  $("out").innerHTML=html;
  $("empty").hidden=pool.length>0;
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;st.kind=b.dataset.kind;st.pick=null;st.open={};save();render()});
["theme","mat","time"].forEach(v=>$("v-"+v).onclick=()=>{st.view=v;st.pick=null;st.open={};save();render()});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.pick=b.dataset.k||null;render();window.scrollTo({top:$("out").offsetTop-190,behavior:"smooth"})});
$("out").addEventListener("click",e=>{const b=e.target.closest(".more");if(!b)return;st.open[b.dataset.open]=true;render()});
$("year").onchange=e=>{st.year=e.target.value;st.open={};render()};
$("month").onchange=e=>{st.month=e.target.value;st.open={};render()};
$("q").addEventListener("input",e=>{st.q=e.target.value.trim().toLowerCase();st.open={};render()});
if(location.hash==="#letters")st.kind="L"; else if(location.hash==="#news")st.kind="N";
render();
</script>
</body>
</html>
